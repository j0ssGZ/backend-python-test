services:
  app:
    build: 
      context: ./app
      dockerfile: Dockerfile
    network_mode: "service:provider"
    environment:
      NOTIFY_PROVIDER_URL: ${NOTIFY_PROVIDER_URL:-http://127.0.0.1:3001}
      NOTIFY_PROVIDER_API_KEY: ${NOTIFY_PROVIDER_API_KEY:-test-dev-2026}
      NOTIFY_BACKLOG_CAPACITY: ${NOTIFY_BACKLOG_CAPACITY:-10000}
      NOTIFY_WORKER_COUNT: ${NOTIFY_WORKER_COUNT:-4}
      NOTIFY_MAX_ATTEMPTS: ${NOTIFY_MAX_ATTEMPTS:-5}
      NOTIFY_LEASE_SECONDS: ${NOTIFY_LEASE_SECONDS:-30}
      NOTIFY_ATTEMPT_TIMEOUT: ${NOTIFY_ATTEMPT_TIMEOUT:-5}
      NOTIFY_RATE_LIMIT: ${NOTIFY_RATE_LIMIT:-50}
      NOTIFY_RATE_WINDOW: ${NOTIFY_RATE_WINDOW:-10}
      NOTIFY_RATE_SPACING: ${NOTIFY_RATE_SPACING:-0.2222222222222222}
    volumes:
      - notification-data:/data
    depends_on:
      provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  provider:
    build:
      context: ./provider
    container_name: backend-provider
    ports:
      - "3001:3001"
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3001/docs\")'"]
      interval: 5s
      timeout: 2s
      retries: 3

  load-test:
    image: grafana/k6:latest
    volumes:
      - ./platform/k6:/scripts
    entrypoint: ["k6", "run", "--out", "influxdb=http://influxdb:8086/k6", "/scripts/test.js"]
    environment:
      - TARGET_URL=http://provider:5000
    depends_on:
      app:
        condition: service_healthy
      provider:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  influxdb:
    image: influxdb:1.8
    container_name: backend-influxdb
    volumes:
      - ./platform/influxdb:/docker-entrypoint-initdb.d
    environment:
      - INFLUXDB_DB=k6
    healthcheck:
      test: ["CMD", "influx", "-execute", "show databases"]
      interval: 5s
      timeout: 2s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: backend-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./platform/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - influxdb

  provider-check:
    image: grafana/k6:latest
    container_name: backend-provider-check
    volumes:
      - ./platform/k6:/scripts
    command: run /scripts/health-check.js
    depends_on:
      - provider

volumes:
  notification-data:
